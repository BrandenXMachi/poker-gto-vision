services:
  # GTO Preflop Trainer (serves lelabubu.ca).
  #
  # The trainer is a self-contained static app in frontend/public/gto-trainer/,
  # framed at the site root by a minimal Next.js shell. There is no backend:
  # the former vision/analysis service has been removed from this deployment.
  - type: web
    name: poker-gto-vision-frontend
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    envVars:
      - key: NODE_VERSION
        value: 18
